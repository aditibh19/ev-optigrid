services:
  app:
    build: .
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ev_optigrid
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 6

  mongo:
    image: mongo:7
    volumes:
      - optigrid-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  optigrid-mongo:
